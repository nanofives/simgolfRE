[pytest]
testpaths = tests
# -p no:faulthandler: on Windows pytest's faulthandler is a vectored exception handler and prints
# FIRST-CHANCE access violations that Unicorn's native mem_map raises and handles itself (the replay
# tests pass and replay.py runs clean outside pytest). Without this the log shows scary, harmless traces.
addopts = -ra -p no:faulthandler
markers =
    static: pure file checks, no process launched
    runtime: launches the game (serial; single-instance)
    ghidra: Ghidra headless / MCP
    slow: repeated-boot reliability and full-intro runs
