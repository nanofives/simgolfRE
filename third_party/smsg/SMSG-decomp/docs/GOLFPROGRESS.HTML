    <title>Decompilation Status</title>
    <style>
      body {
        background: #202020;
        color: #f0f0f0;
        font-family: sans-serif;
      }

      h1 {
        text-align: center;
      }

      .main {
        width: 800px;
        max-width: 100%;
        margin: auto;
      }

      #query {
        width: 100%;
        box-sizing: border-box;
        background: #303030;
        color: #f0f0f0;
        border: 1px #f0f0f0 solid;
        border-radius: 0.5em;
        padding: 0.5em;
      }

      #query::placeholder {
        color: #b0b0b0;
      }

      .filters {
        display: flex;
        justify-content: space-between;
        font-size: 10pt;
        margin: 0.5em 0 1em 0;
      }

      fieldset {
        display: flex;
        align-items: center;
      }

      fieldset.choices {
        gap: 10px;
        padding-right: 20px;
      }

      .radios {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      label {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }

      button, input[type=checkbox], input[type=radio] {
        cursor: pointer;
        user-select: none;
      }

      .pager button {
        padding: 0.25em 0.5em;
      }

      .pager select {
        cursor: pointer;
        padding: 0.25em;
        margin: 0 0.5em;
      }

      p.rowcount {
        align-self: flex-end;
        font-size: 1.2em;
        margin-bottom: 0;
      }

      #listing {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        border: 1px #f0f0f0 solid;
        font-family: monospace;
      }

      #listing > thead th {
        background: #282828;
        padding: 0.5em;
        text-align: left;
        user-select: none;
      }

      #listing > thead th.addr {
        width: 10ch;
      }

      #listing > thead th.narrow {
        width: 8ch;
      }

      #listing > thead th > div {
        display: flex;
        column-gap: 0.5em;
      }

      #listing > thead th:last-child > div {
        flex-direction: row-reverse;
        justify-content: right;
      }

      #listing > thead th > div > span {
        cursor: pointer;
      }

      #listing > thead th > div > span:hover {
        text-decoration: underline dotted;
      }

      #listing > tbody > tr.fn.odd {
        background: #282828;
      }

      #listing > tbody > tr.fn.even {
        background: #383838;
      }

      #listing > tbody > tr.fn:hover {
        background: #404040;
      }

      #listing > tbody > tr.fn > td {
        border-top: 1px #f0f0f0 solid;
        padding: 0.5em;
        vertical-align: top;
        white-space: nowrap;
      }

      #listing > tbody > tr.fn > td.name {
        white-space: normal;
        word-break: break-all;
      }

      #listing > tbody > tr.fn > td.name:hover {
        cursor: pointer;
        text-decoration: underline dotted;
      }

      #listing > tbody > tr.fn > td:last-child {
        text-align: right;
      }

      #listing > tbody > tr.detail {
        contain: paint;
      }

      #listing > tbody > tr.detail > td {
        border: 1px #f0f0f0 solid;
        border-bottom: 0 none;
        padding: 0.5em;
        word-break: break-all;
      }

      .no-diff {
        font-style: italic;
        text-align: center;
      }

      fieldset.addrs {
        margin-bottom: 20px;
      }

      fieldset.addrs label {
        display: inline;
        margin-right: 10px;
      }

      table.hunk {
        border-collapse: collapse;
      }

      table.hunk:not(:last-child) {
        margin-bottom: 40px;
      }

      table.hunk th, table.hunk td {
        border: 0 none;
        padding: 0 10px 0 0;
      }

      table.hunk th {
        word-break: keep-all;
      }

      .diff[data-show="0"] table.hunk th,
      .diff[data-show="1"] table.hunk th + th {
        display: none;
      }

      .minus {
        color: #ff8080;
      }

      .plus {
        color: #80ff80;
      }

      .at {
        color: #8080ff;
      }

      .copy {
        position: relative;
        cursor: pointer;
      }

      .copy:hover {
        text-decoration: underline dotted;
      }

      .copy::after {
        content: 'Copy to clipboard';
        display: none;
        position: absolute;
        left: 0;
        bottom: 120%;
        width: fit-content;
        padding: 1px 2px;
        border-radius: 1px;
        background-color: #fff;
        color: #222;
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.05);
      }

      .copy:hover::after {
        display: block;
      }

      .copy.copied:hover::after {
        content: 'Copied!';

    <script>
'use strict';

(() => {
  const PAGE_SIZE = 200;

  // The report rows, and the view's state.
  const report = JSON.parse(document.getElementById('report').textContent);
  const rows = report.data;
  const view = {
    query: '',
    searchIn: 1, // 1 name or address, 2 any instruction, 3 differing instructions only
    hidePerfect: false,
    hideStub: false,
    showRecomp: false,
    sortCol: 'address',
    sortDesc: false,
    page: 0,
    open: new Set(),
    results: [],
    pages: [],
  };

  const isStub = (r) => r.stub === true;
  const isEffective = (r) => r.effective === true;

  function percent(r) {
    if (isStub(r)) return 'stub';
    if (isEffective(r)) return '100.00%*';
    return `${(r.matching * 100).toFixed(2)}%`;
  }

  // Matching sorts exact first, then effective matches, then by similarity, stubs last.
  function rank(r) {
    if (isStub(r)) return -1;
    if (isEffective(r)) return 1.0;
    if (r.matching === 1.0) return 1000;
    return r.matching;
  }

  function diffCount(r) {
    if (!Array.isArray(r.diff)) return '';
    let n = 0;
    for (const [, blocks] of r.diff) {
      for (const b of blocks) {
        if (!('both' in b)) n += 1;
      }
    }
    if (n === 0) return '';
    return n === 1 ? '1 diff' : `${n} diffs`;
  }

  function hunkLines(r, withContext) {
    const out = [];
    if (!Array.isArray(r.diff)) return out;
    for (const [, blocks] of r.diff) {
      for (const b of blocks) {
        if (withContext && b.both) out.push(...b.both);
        if (b.orig) out.push(...b.orig);
        if (b.recomp) out.push(...b.recomp);
      }
    }
    return out;
  }

  function keep(r) {
    if (view.hidePerfect && (isEffective(r) || r.matching >= 1)) return false;
    if (view.hideStub && isStub(r)) return false;
    const q = view.query.toLowerCase().trim();
    if (q === '') return true;
    if (view.searchIn === 1) {
      return r.address.includes(q) || r.name.toLowerCase().includes(q);
    }
    return hunkLines(r, view.searchIn === 2).some((l) => l[1].toLowerCase().trim().includes(q));
  }

  function compare(a, b) {
    const x = view.sortCol === 'matching' ? rank(a) : a[view.sortCol];
    const y = view.sortCol === 'matching' ? rank(b) : b[view.sortCol];
    if (x > y) return view.sortDesc ? -1 : 1;
    if (x < y) return view.sortDesc ? 1 : -1;
    return 0;
  }

  function refresh() {
    view.results = rows.filter(keep).sort(compare);
    view.pages = [];
    for (let i = 0; i < view.results.length; i += PAGE_SIZE) {
      view.pages.push(view.results.slice(i, i + PAGE_SIZE));
    }
    view.page = Math.max(0, Math.min(view.page, view.pages.length - 1));
  }

  function el(tag, props = {}, ...children) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'className') e.className = v;
      else if (k === 'text') e.textContent = v;
      else e.setAttribute(k, v);
    }
    e.append(...children);
    return e;
  }

  function copyable(text) {
    const s = el('span', { className: 'copy', text });
    s.addEventListener('click', () => {
      navigator.clipboard.writeText(text);
      s.classList.add('copied');
    });
    s.addEventListener('mouseout', () => s.classList.remove('copied'));
    return s;
  }

  function columns() {
    const c = [['address', 'Address', 'addr']];
    if (view.showRecomp) c.push(['recomp', 'Recomp', 'addr']);
    c.push(['name', 'Name', ''], ['diffs', '', 'narrow'], ['matching', 'Matching', 'narrow']);
    return c;
  }

  function header() {
    const tr = el('tr');
    for (const [key, title, cls] of columns()) {
      const th = el('th', cls ? { className: cls } : {});
      if (key !== 'diffs') {
        const name = el('span', { text: title });
        name.addEventListener('click', () => {
          if (view.sortCol === key) view.sortDesc = !view.sortDesc;
          else view.sortCol = key;
          refresh();
          draw();
        });
        const arrow = el('div');
        if (key === view.sortCol) arrow.textContent = view.sortDesc ? '▼' : '▲';
        th.append(el('div', {}, name, arrow));
      }
      tr.append(th);
    }
    return tr;
  }

  function addressDisplay(box) {
    const field = el('fieldset', { className: 'addrs' }, el('legend', { text: 'Address display:' }));
    const group = `show${Math.random().toString(36).slice(2)}`;
    ['None', 'Original', 'Both'].forEach((label, v) => {
      const id = `${group}-${v}`;
      const radio = el('input', { type: 'radio', name: group, id, value: String(v) });
      radio.checked = box.dataset.show === String(v);
      radio.addEventListener('change', () => {
        box.dataset.show = String(v);
      });
      field.append(radio, el('label', { for: id, text: label }));
    });
    return field;
  }

  function diffView(r) {
    const box = el('div', { className: 'diff' });
    box.dataset.show = '1';
    box.append(addressDisplay(box));
    const hunks = el('div');
    for (const [slug, blocks] of r.diff) {
      hunks.append(
        el('div', {}, el('div', { className: 'minus', text: '---' }), el('div', { className: 'plus', text: '+++' }),
          el('div', { className: 'at', text: slug })),
      );
      const body = el('tbody');
      for (const b of blocks) {
        for (const [a, text, ours] of b.both || []) {
          body.append(el('tr', {}, el('th', { text: a }), el('th', { text: ours }), el('td', { text })));
        }
        for (const [a, text] of b.orig || []) {
          body.append(el('tr', {}, el('th', { text: a }), el('th'), el('td', { className: 'minus', text: `-${text}` })));
        }
        for (const [a, text] of b.recomp || []) {
          body.append(el('tr', {}, el('th'), el('th', { text: a }), el('td', { className: 'plus', text: `+${text}` })));
        }
      }
      hunks.append(el('table', { className: 'hunk' }, body));
    }
    box.append(hunks);
    return box;
  }

  function detailRow(r) {
    const td = el('td', { colspan: String(columns().length) });
    if (Array.isArray(r.diff) && r.diff.length > 0) {
      td.append(diffView(r));
    } else {
      td.append(el('div', {
        className: 'no-diff',
        text: r.matching === 1.0 ? 'Identical function - no diff' : 'No diff available',
      }));
    }
    const tr = el('tr', { className: 'detail' }, td);
    tr.dataset.of = r.address;
    return tr;
  }

  function functionRow(r) {
    const tr = el('tr', { className: 'fn' });
    tr.dataset.address = r.address;
    tr.append(el('td', {}, copyable(r.address)));
    if (view.showRecomp) tr.append(el('td', {}, copyable(r.recomp || '')));
    const name = el('td', { className: 'name', text: r.name });
    name.addEventListener('click', () => toggle(r, tr));
    tr.append(name, el('td', { text: diffCount(r) }), el('td', { text: percent(r) }));
    return tr;
  }

  // Alternate row shades over every row shown, an unfolded diff included.
  function stripe() {
    let n = 0;
    for (const tr of document.querySelectorAll('#listing > tbody > tr')) {
      n += 1;
      tr.classList.toggle('odd', n % 2 === 1);
      tr.classList.toggle('even', n % 2 === 0);
    }
  }

  function toggle(r, tr) {
    if (view.open.has(r.address)) {
      view.open.delete(r.address);
      const d = tr.nextElementSibling;
      if (d && d.classList.contains('detail')) d.remove();
    } else {
      view.open.add(r.address);
      tr.after(detailRow(r));
    }
    stripe();
  }

  function truncate(s) {
    const cut = s.indexOf('::');
    const head = cut === -1 ? s : s.slice(0, cut);
    return head.length > 20 ? `${head.slice(0, 20)}...` : head;
  }

  function pageLabel(rowsOfPage) {
    const first = rowsOfPage[0];
    const last = rowsOfPage[rowsOfPage.length - 1];
    const show = (r) => (view.sortCol === 'matching' ? percent(r) : String(r[view.sortCol]));
    return `${view.sortCol}: ${truncate(show(first))} to ${truncate(show(last))}`;
  }

  function drawPager() {
    const select = document.getElementById('page');
    const count = Math.max(1, view.pages.length);
    document.getElementById('pageOf').textContent = `Page ${view.page + 1} of ${count}`;
    document.getElementById('count').textContent = String(view.results.length);
    document.getElementById('prev').disabled = view.page === 0;
    document.getElementById('next').disabled = view.page >= count - 1;
    select.replaceChildren();
    if (view.results.length === 0) {
      select.disabled = true;
      select.append(el('option', { text: '- no results -' }));
      return;
    }
    select.disabled = false;
    view.pages.forEach((p, i) => {
      const o = el('option', { value: String(i), text: pageLabel(p) });
      o.selected = i === view.page;
      select.append(o);
    });
  }

  function draw() {
    const table = document.getElementById('listing');
    table.tHead.replaceChildren(header());
    const body = table.tBodies[0];
    const shown = [];
    for (const r of view.pages[view.page] || []) {
      const tr = functionRow(r);
      shown.push(tr);
      if (view.open.has(r.address)) shown.push(detailRow(r));
    }
    body.replaceChildren(...shown);
    stripe();
    drawPager();
    const q = document.getElementById('query');
    q.placeholder = view.searchIn === 1 ? q.dataset.nameHint : q.dataset.asmHint;
  }

  function wire() {
    document.title = `smsg: ${report.file}`;
    document.getElementById('query').addEventListener('input', (e) => {
      view.query = e.target.value;
      refresh();
      draw();
    });
    for (const radio of document.querySelectorAll('input[name=searchIn]')) {
      radio.addEventListener('change', () => {
        view.searchIn = parseInt(radio.value, 10);
        refresh();
        draw();
      });
    }
    document.getElementById('hidePerfect').addEventListener('change', (e) => {
      view.hidePerfect = e.target.checked;
      refresh();
      draw();
    });
    document.getElementById('hideStub').addEventListener('change', (e) => {
      view.hideStub = e.target.checked;
      refresh();
      draw();
    });
    document.getElementById('showRecomp').addEventListener('change', (e) => {
      view.showRecomp = e.target.checked;
      if (!view.showRecomp && view.sortCol === 'recomp') {
        view.sortCol = 'address';
        refresh();
      }
      draw();
    });
    document.getElementById('prev').addEventListener('click', () => {
      view.page = Math.max(0, view.page - 1);
      draw();
    });
    document.getElementById('next').addEventListener('click', () => {
      view.page = Math.min(view.pages.length - 1, view.page + 1);
      draw();
    });
    document.getElementById('page').addEventListener('change', (e) => {
      view.page = parseInt(e.target.value, 10);
      draw();
    });
    refresh();
    draw();
  }

  window.addEventListener('DOMContentLoaded', wire);
})();

    </script>

  <body>
    <div class="main">
      <h1>Decompilation Status</h1>
      <input id="query" type="search" placeholder="Search for offset or function name..." data-name-hint="Search for offset or function name..." data-asm-hint="Search for instruction...">
      <div class="filters">
        <fieldset class="choices">
          <legend>Options:</legend>
          <label><input type="checkbox" id="hidePerfect">Hide 100% match</label>
          <label><input type="checkbox" id="hideStub">Hide stubs</label>
          <label><input type="checkbox" id="showRecomp">Show recomp address</label>
        </fieldset>
        <fieldset class="choices">
          <legend>Search filters on:</legend>
