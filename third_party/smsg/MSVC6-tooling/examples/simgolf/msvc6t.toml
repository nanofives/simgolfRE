[source]
root = "${SIMGOLF}"
exclude = ["toolchain"]
syntax = { "*.ksy" = "hash-inline", "*.txt" = "hash-line" }

[source.format]
command = ["${MSVC6T_CLANG_FORMAT}", "--assume-filename={path}"]
files = ["*.c", "*.cc", "*.cpp", "*.cxx", "*.h", "*.hh", "*.hpp", "*.hxx", "*.inl", "*.inc"]

[source.layout]
"golf/jackal.lib/include/AssetSurface.h" = "line-keep"
"golf/jackal.lib/include/BasePop.h" = "line-keep"
"golf/jackal.lib/include/BasePopDtors.h" = "line-keep"
"golf/jackal.lib/include/ImageButton.h" = "line-keep"
"golf/jackal.lib/include/ListBoxCtl.h" = "line-keep"
"golf/jackal.lib/include/ListBox.h" = "line-keep"
"golf/jackal.lib/include/WidgetBase.h" = "line-keep"
"golf/jackal.lib/src/BasePop.cpp" = "line-keep"
"jgl/jgld.dll/src/jglsprite.cpp" = "anchored"
"jgl/jgld.dll/src/jglsprite_8_16c.cpp" = "anchored"
"jgl/jgld.dll/src/jglbuffer.cpp" = "line-keep"
"terrain/Terrain.dll/src/Terrain.cpp" = "anchored"

[source.prove]
compile = ["wine", "{win:${MSVC6T_VC6}/VC98/Bin/CL.EXE}", "{cflags}", "/Fp{scratch_win}\\tu.pch", "/Fd{scratch_win}\\tu.pdb", "/Fo{out_win}", "{source_win}"]
jobs = 1

[source.prove.env]
WINEPREFIX = "${MSVC6T_WINEPREFIX}"
WINEDEBUG = "-all"
WINEPATH = "{win:${MSVC6T_VC6}/Common/MSDev98/Bin}"
INCLUDE = "{win:${SIMGOLF}/sound/DXSDK/include};{win:${MSVC6T_VC6}/VC98/Include};{win:${MSVC6T_VC6}/VC98/MFC/Include};{win:${SIMGOLF}/golf/jpeg.lib/jpeg-6a};{win:${SIMGOLF}/sound/lpc10.lib/lpc10/lpc10-1.5/lpc55-C};{root_win}\\terrain\\Terrain.dll\\include;{root_win}\\sound\\sound.dll\\include;{root_win}\\jgl\\jgld.dll\\include;{root_win}\\golf\\binkw32.lib"

