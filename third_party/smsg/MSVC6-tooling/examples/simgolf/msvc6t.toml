schema = 1
optional = ["SIMGOLF_GHIDRA", "SIMGOLF_DEMO", "SIMGOLF_UNWRAPPED", "SIMGOLF_PDBS", "MSVC6DECOMP"]

[toolchain.vc6]
root = "${MSVC6T_VC6}"
layout = "vs6"
expect = { cl = "12.00.8168", c1 = "12.00.8168", c1xx = "12.00.8168", c2 = "12.00.8168", link = "6.00.8168" }

[toolchain.vc6sp5]
root = "${MSVC6T_VC6SP5}"
layout = "vs6"
expect = { c2 = "12.00.8966", link = "6.00.8447" }

[runner]
kind = "wine"
command = ["wine"]
prefixes = "${MSVC6T_PREFIXES:-~/.cache/msvc6t/prefixes}"
template = "${MSVC6T_WINE_TEMPLATE:-~/.wine}"
tokens = "${MSVC6T_TOKENS:-/tmp/msvc6t-jobs}"
native_msvcrt = "${MSVC6T_MSVCRT}"
msvcrt_md5 = "63da4613383ec70e047b4cd5c48f0b05"
display = { name = ":99", start = ["Xvfb", ":99", "-screen", "0", "1024x768x24", "-nolisten", "tcp"] }

[cache]
dir = "${MSVC6T_CACHE_DIR:-~/.cache/msvc6t/cl}"
max = "20 GiB"

[[image]]
id = "GOLF"
reference = "${SIMGOLF_ORIG}/golf.exe"
sha256 = "a78b196737f86600ab95693334a7015e5638cde581c6c78eb2c6227c7b9834ab"
compiler = "vc6"
linker = "vc6"
clock = ["coff.timestamp", "export.timestamp"]
project = { dsw = "${SIMGOLF}/golf/golf.dsw", config = "golf - Win32 Release" }
functions = ["reccmp-csv:tables/GOLF.extents.csv", "ghidra-json:${SIMGOLF_GHIDRA}/golf.exe.functions.json", "discover"]
names = ["exports", "reccmp-csv:${SIMGOLF}/golf/golf.exe/smsg-globals.csv", "tsv:tables/GOLF.symbols.tsv", "tsv:tables/GOLF.addresses.tsv", "imports"]
dropped = ["tsv:tables/GOLF.dropped.tsv"]
libraries = ["$vc6/VC98/Lib/LIBCMT.LIB", "${MSVC6T_VC6SP2}/VC98/lib/lib/libcmt.lib", "$vc6sp5/VC98/Lib/LIBCMT.LIB", "$vc6/VC98/Lib/LIBCIMT.LIB", "$vc6sp5/VC98/Lib/LIBCIMT.LIB"]

